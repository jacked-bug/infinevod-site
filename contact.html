<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | InfinevoD BIM Excellence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: black; color: white; overflow-x: hidden; }
    
    /* Background Ken Burns (Re-using your cinematic style) */
    .contact-bg {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('./images/docs.jpg'); /* Using your docs image as bg */
      background-size: cover; background-position: center;
      animation: kenBurns 30s infinite alternate;
    }

    @keyframes kenBurns { from { transform: scale(1); } to { transform: scale(1.1); } }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    input, textarea {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: white !important; outline: none; transition: all 0.3s;
    }

    input:focus, textarea:focus { border-color: white !important; background: rgba(255, 255, 255, 0.1) !important; }

    @keyframes blurFadeUp { from { opacity: 0; filter: blur(15px); transform: translateY(30px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
    .animate-up { opacity: 0; animation: blurFadeUp 0.8s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center">

  <div class="contact-bg"></div>

  <!-- Navbar -->
  <nav class="relative w-full z-50 flex justify-between items-center px-6 md:px-12 py-6">
    <a href="index.html" class="flex items-center space-x-2">
      <img src="./images/logo.png" alt="Logo" class="h-10 w-auto">
    </a>
    <a href="index.html" class="liquid-glass rounded-full px-6 py-2 text-sm font-medium flex items-center">
      <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Experience
    </a>
  </nav>

  <!-- Contact Form Content -->
  <main class="relative z-10 w-full max-w-5xl px-6 py-12 grid grid-cols-1 md:grid-cols-2 gap-16 items-start">
    
    <!-- Left: Info -->
    <div class="animate-up" style="animation-delay: 100ms;">
      <h1 class="text-5xl font-light tracking-tight mb-6">Get in Touch <br><span class="text-gray-400 font-normal">for BIM Excellence</span></h1>
      <p class="text-gray-400 text-lg mb-12">Connect with our structural and architectural specialists to optimize your building lifecycle.</p>
      
      <div class="space-y-8">
        <div class="flex items-start space-x-4">
          <i data-lucide="map-pin" class="w-6 h-6 text-gray-400 mt-1"></i>
          <div>
            <h3 class="font-medium text-white">Address</h3>
            <p class="text-gray-400 text-sm">Keethas Arcade, 4th Sundar Nagar, KK Nagar, Trichy, INDIA - 620 021</p>
          </div>
        </div>
        <div class="flex items-start space-x-4">
          <i data-lucide="mail" class="w-6 h-6 text-gray-400 mt-1"></i>
          <div>
            <h3 class="font-medium text-white">Email</h3>
            <p class="text-gray-400 text-sm">saymyname911walt@gmail.com</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Form -->
    <div class="liquid-glass p-8 rounded-3xl animate-up" style="animation-delay: 300ms;">
      <h2 class="text-2xl font-medium mb-8">Send Message</h2>
      
      <!-- FORM ACTION: Using FormSubmit.co to actually send the email -->
      <form action="https://formsubmit.co/saymyname911walt@gmail.com" method="POST" class="space-y-5">
        
        <!-- Honeypot to prevent spam -->
        <input type="text" name="_honey" style="display:none">
        <!-- Disable Captcha for clean UI -->
        <input type="hidden" name="_captcha" value="false">
        <!-- Success Redirect -->
        <input type="hidden" name="_next" value="https://infinevod-site.vercel.app/">

        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col space-y-2">
            <label class="text-xs uppercase tracking-widest text-gray-500">Name</label>
            <input type="text" name="name" required class="p-3 rounded-xl">
          </div>
          <div class="flex flex-col space-y-2">
            <label class="text-xs uppercase tracking-widest text-gray-500">Phone</label>
            <input type="tel" name="phone" class="p-3 rounded-xl">
          </div>
        </div>

        <div class="flex flex-col space-y-2">
          <label class="text-xs uppercase tracking-widest text-gray-500">E-mail</label>
          <input type="email" name="email" required class="p-3 rounded-xl">
        </div>

        <div class="flex flex-col space-y-2">
          <label class="text-xs uppercase tracking-widest text-gray-500">Subject</label>
          <input type="text" name="subject" class="p-3 rounded-xl">
        </div>

        <div class="flex flex-col space-y-2">
          <label class="text-xs uppercase tracking-widest text-gray-500">Message</label>
          <textarea name="message" required rows="4" class="p-3 rounded-xl resize-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-white text-black font-semibold py-4 rounded-xl hover:bg-gray-200 transition-colors uppercase tracking-widest text-xs">
          Send Now
        </button>
      </form>
    </div>

  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
